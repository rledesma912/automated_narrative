[project]
name = "narrative-forge"
version = "1.0.0"
description = "Sistema de generación granular de relatos de terror con IA local (Ollama)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "anthropic>=0.40.0",
    "sse-starlette>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.playwright]
base_url = "http://localhost:3010"
browser = "chromium"
headed = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "ARG002", "B008", "B904"]
select = ["E", "F", "W", "I", "N", "ARG", "B"]

[tool.mypy]
pythonversion = "312"
ignore_missing_imports = true
