<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo -->
  <rect width="200" height="200" fill="#f8f7f5" rx="40"/>
  
  <!-- Libro abierto (símbolo de narrativa) -->
  <g transform="translate(50, 50)">
    <!-- Página izquierda -->
    <path d="M 30 20 L 30 80 Q 30 85 25 85 L 10 85 Q 5 85 5 80 L 5 20 Q 5 15 10 15 L 25 15 Q 30 15 30 20 Z" 
          fill="#c4bdb0" stroke="#996633" stroke-width="1.5"/>
    
    <!-- Página derecha -->
    <path d="M 70 20 L 70 80 Q 70 85 75 85 L 90 85 Q 95 85 95 80 L 95 20 Q 95 15 90 15 L 75 15 Q 70 15 70 20 Z" 
          fill="#ede5d7" stroke="#996633" stroke-width="1.5"/>
    
    <!-- Líneas de texto página izquierda -->
    <line x1="12" y1="32" x2="26" y2="32" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="42" x2="26" y2="42" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="52" x2="26" y2="52" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="62" x2="22" y2="62" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Líneas de texto página derecha -->
    <line x1="74" y1="32" x2="88" y2="32" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="74" y1="42" x2="88" y2="42" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="74" y1="52" x2="88" y2="52" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    <line x1="74" y1="62" x2="84" y2="62" stroke="#996633" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Lomo del libro -->
    <rect x="48" y="20" width="4" height="65" fill="#7a5c3a" opacity="0.4"/>
  </g>
  
  <!-- Decoración (estrella similar al del sitio) -->
  <g transform="translate(140, 30)" opacity="0.8">
    <path d="M 8 0 L 10 6 L 16 6 L 11 10 L 13 16 L 8 12 L 3 16 L 5 10 L 0 6 L 6 6 Z" fill="#996633"/>
  </g>
</svg>