beats_spec:
  version: "3.0"
  granularity: "5_actos"

  # Spec-081: se elimina anchor_priorities. Cada beat recibe la resonancia N
  # definida en llm_narrative_definition.yaml mediante mapeo 1:1 (Beat N → Pilar N).

  # Spec-450 §2: cuánto se muestra de una entidad en un beat. Cada beat mapea el
  # reveal_level de la entidad (nunca/insinuada/progresiva/explicita) a una de
  # estas exposiciones. `show` = campos de la ficha que recibe la Voz (nunca la
  # ficha completa si la exposición no lo pide); `guide` = instrucción de revelación.
  # `max_manifestations` (Spec-450 §10): tope de manifestaciones que ve la Voz, sin
  # las reservadas para un acto posterior (las que la sinopsis ubica más adelante).
  entity_exposures:
    senales:
      show: [manifestations]
      max_manifestations: 2
      guide: "Solo señales: una o dos de la lista, sutiles, no todas (sonidos, rastros, sensaciones). Sin mostrar una figura completa, sin nombrarla ni decir qué es."
    senales_intensas:
      show: [manifestations]
      max_manifestations: 3
      guide: "Señales intensas y cercanas (dos o tres de la lista, no todas), pero sin confirmar qué es ni nombrarla."
    manifestacion_parcial:
      show: [manifestations]
      max_manifestations: 1
      guide: "Se deja ver en parte: una sola manifestación de la lista (un fragmento, una silueta borrosa, un efecto directo), no todas; sin nombrarla ni explicar qué es."
    presencia_directa:
      show: [description, manifestations]
      guide: "Presencia directa: se la ve y se la enfrenta, todavía sin nombrarla ni explicar del todo qué es."
    presencia_plena:
      show: [name, nature, description, manifestations, limits]
      guide: "Presencia plena: se muestra entera, con su nombre y su naturaleza."
    presencia:
      show: [name, nature, description, manifestations]
      guide: "Presencia abierta: el narrador sabe qué es y la nombra."
    revelacion:
      show: [name, nature, description, manifestations]
      guide: "Revelación: el narrador reconoce qué es (nombre, naturaleza, qué quiere)."
    confrontacion:
      show: [name, nature, description, manifestations, limits]
      guide: "Confrontación directa con la entidad."
    limites_consecuencias:
      show: [name, nature, manifestations, limits]
      guide: "Ya revelada: sus límites se ponen a prueba y se ven las consecuencias de lo que hizo."
    consecuencias:
      show: [name, nature, manifestations, limits]
      guide: "Consecuencias de su acción; sus límites se ponen en juego."
    huella:
      show: [name, manifestations]
      guide: "Huella: queda su marca o su rastro; no vuelve a mostrarse entera."
    segun_acto_5:
      show: [name, nature, manifestations]
      guide: "Lo decide el EVENTO de este acto: si la identifica, se la nombra; si no, queda ambigua y solo se ve su rastro."

  # Spec-650: estructuras del relato. Cada historia elige una (`story.structure`);
  # la cantidad de actos, sus nombres y su función salen de acá, nunca de una constante.
  # `revela_secreto`: el acto donde se revela la historia secreta del taller.
  estructuras:
    largo:
      label: "Largo · 5 actos · unos 15 minutos"
      palabras_total: "2.500"  # lo que dice el objetivo del asistente (texto de siempre)
      hechos_por_acto: "de 3 a 5 hechos"  # lo que pide el Planificador para cada acto
      revela_secreto: 4
      # D10: al pasar de otra estructura, la regla anclada al acto N va al acto M.
      reubicar_desde:
        corto: { 1: 1, 2: 3, 3: 5 }
      actos:

        - id: 1
          name: "exposicion"
          label: "Exposición"  # Spec-620: el nombre que ve la Voz
          nombre_ui: "Cómo empieza"  # Spec-650: el nombre que ve la persona (= frontend/src/utils/actos.ts)
          word_limit: "entre 450 y 530 palabras"
          intent: "establecer normalidad y como cliffhanger para siguiente beat sembrar una inquietud sutil"
          intensity: baja
          must:
            - "presentar situacion base del narrador"
            - "introducir una anomalia sutil"
            - "incluir regla, advertencia o limite implicito"
          must_not: []
          # Spec-450 §2: reglas de revelación según el reveal_level de la entidad
          # principal. `default` = sin entidades y niveles sin override.
          reveal_rules:
            must_not:
              default: ["confirmar lo paranormal"]
              explicita: []
          state_change:
            from: "estabilidad"
            to: "incomodidad leve"
          success_signal:
            - "quien escucha el relato percibe que algo no encaja pero no sabe que"
          entity_exposure:
            nunca: senales
            insinuada: senales
            progresiva: senales
            explicita: presencia

        - id: 2
          name: "accion_ascendente"
          label: "Acción ascendente"  # Spec-620: el nombre que ve la Voz
          nombre_ui: "Se complica"  # Spec-650: el nombre que ve la persona (= frontend/src/utils/actos.ts)
          word_limit: "entre 450 y 530 palabras"
          intent: "activar el conflicto mediante transgresion"
          intensity: media
          must:
            - "romper la regla o ignorar la advertencia"
            - "mostrar un evento anomalo concreto"
            - "intentar explicacion racional"
          must_not: []
          reveal_rules:
            must_not:
              default: ["aceptar lo paranormal como hecho"]
              explicita: []
          state_change:
            from: "incomodidad"
            to: "inquietud concreta"
          success_signal:
            - "quien escucha el relato nota que el protagonista duda pero sigue dentro de una logica racional"
          entity_exposure:
            nunca: senales
            insinuada: manifestacion_parcial
            progresiva: manifestacion_parcial
            explicita: presencia

        - id: 3
          name: "climax"
          label: "Clímax"  # Spec-620: el nombre que ve la Voz
          nombre_ui: "El peor momento"  # Spec-650: el nombre que ve la persona (= frontend/src/utils/actos.ts)
          word_limit: "entre 450 y 530 palabras"
          intent: "forzar reconocimiento del horror"
          intensity: alta
          must:
            - "invalidar explicacion racional"
          reveal_rules:
            must:
              default: ["mostrar amenaza o presencia directa"]
              nunca: ["mostrar señales intensas de la amenaza sin confirmar qué es"]
          must_not:
            - "explicar origen o reglas completas del fenomeno"
          state_change:
            from: "negacion"
            to: "reconocimiento"
          success_signal:
            - "quien escucha el relato siente que el protagonista ya no puede negar lo que enfrenta"
          entity_exposure:
            nunca: senales_intensas
            insinuada: revelacion
            progresiva: presencia_directa
            explicita: confrontacion

        - id: 4
          name: "accion_descendente"
          label: "Acción descendente"  # Spec-620: el nombre que ve la Voz
          nombre_ui: "Qué hace después"  # Spec-650: el nombre que ve la persona (= frontend/src/utils/actos.ts)
          word_limit: "entre 450 y 530 palabras"
          intent: "llevar al protagonista al colapso y reaccion"
          intensity: media-alta
          must:
            - "perdida de control o desorientacion"
            - "intento de escape o respuesta (instinto, fe, memoria)"
          must_not:
            - "resolución fácil del conflicto"
          state_change:
            from: "reconocimiento"
            to: "desesperacion"
          success_signal:
            - "quien escucha el relato siente que la situacion empeora antes de cualquier mejora"
          entity_exposure:
            nunca: senales
            insinuada: limites_consecuencias
            progresiva: presencia_plena
            explicita: consecuencias

        - id: 5
          name: "desenlace"
          label: "Desenlace"  # Spec-620: el nombre que ve la Voz
          nombre_ui: "Cómo termina"  # Spec-650: el nombre que ve la persona (= frontend/src/utils/actos.ts)
          word_limit: "entre 150 y 200 palabras (máxima brevedad emocional)"
          intent: "cerrar con brevedad emocional, escape incompleto y secuela"
          intensity: baja
          must:
            - "salida rapida o alejamiento del peligro"
            - "marca persistente o evidencia ambigua"
            - "reflexion final corta y contundente"
          must_not:
            - "cerrar completamente el misterio"
          state_change:
            from: "desesperacion"
            to: "calma inestable"
          success_signal:
            - "quien escucha el relato queda con la sensacion de que el horror no termino"
          entity_exposure:
            nunca: segun_acto_5
            insinuada: huella
            progresiva: huella
            explicita: huella

    # Spec-650: relato corto, ~7 minutos leído en voz alta (≈ 1 050 palabras a 150
    # palabras por minuto, config/video/lectura.yaml). El clímax cae al final del nudo
    # (D3). `palabras` fija el rango de cada acto (880–1 050 en total: S5 midió que Sonnet
    # escribe en el techo del rango o arriba, así que lo real queda cerca de 1 050); `hechos`, cuántos
    # le pide el Planificador (la Voz escribe un párrafo por hecho).
    corto:
      label: "Corto · 3 actos · unos 7 minutos"
      palabras_total: "1.050"
      hechos_por_acto: "exactamente los que pide cada acto arriba (ni uno más: es un relato de unos 7 minutos), hechos"  # el número va en cada acto (`hechos`)
      revela_secreto: 2
      reubicar_desde:
        largo: { 1: 1, 2: 2, 3: 2, 4: 3, 5: 3 }
      actos:

        - id: 1
          name: "inicio"
          label: "Inicio"
          nombre_ui: "Cómo empieza"  # = frontend/src/utils/actos.ts
          palabras: [240, 290]
          hechos: "2 o 3"
          hechos_max: 3  # más que esto → aviso en «Los actos» (Verificador)
          intent: "establecer la normalidad, la regla o advertencia, y sembrar una inquietud sutil"
          intensity: baja
          entity_exposure:
            nunca: senales
            insinuada: senales
            progresiva: senales
            explicita: presencia

        - id: 2
          name: "nudo"
          label: "Nudo"
          nombre_ui: "Qué pasa"
          palabras: [450, 520]
          hechos: "4 o 5"
          hechos_max: 5  # más que esto → aviso en «Los actos» (Verificador)
          intent: "romper la regla, mostrar un evento anómalo concreto y llevar al protagonista hasta el enfrentamiento: la explicación racional ya no alcanza"
          intensity: alta
          entity_exposure:
            nunca: senales_intensas
            insinuada: revelacion
            progresiva: presencia_directa
            explicita: confrontacion

        - id: 3
          name: "desenlace"
          label: "Desenlace"
          nombre_ui: "Cómo termina"
          palabras: [190, 240]
          hechos: "2 o 3"  # absorbe el «qué hace después» del largo (la salida) y el cierre
          hechos_max: 3  # más que esto → aviso en «Los actos» (Verificador)
          intent: "salir o alejarse del peligro sin una resolución fácil y cerrar con brevedad emocional: una marca que queda y la sensación de que el horror no terminó"
          intensity: baja
          entity_exposure:
            nunca: segun_acto_5
            insinuada: huella
            progresiva: huella
            explicita: huella
