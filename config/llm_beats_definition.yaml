beats_spec:
  version: "3.0"
  granularity: "5_actos"

  # Spec-081: se elimina anchor_priorities. Cada beat recibe la resonancia N
  # definida en llm_narrative_definition.yaml mediante mapeo 1:1 (Beat N → Pilar N).

  # Spec-450 §2: cuánto se muestra de una entidad en un beat. Cada beat mapea el
  # reveal_level de la entidad (nunca/insinuada/progresiva/explicita) a una de
  # estas exposiciones. `show` = campos de la ficha que recibe la Voz (nunca la
  # ficha completa si la exposición no lo pide); `guide` = instrucción de revelación.
  entity_exposures:
    senales:
      show: [manifestations]
      guide: "Solo señales: lo que se percibe (sonidos, rastros, sensaciones). Sin nombrarla ni decir qué es."
    senales_intensas:
      show: [manifestations]
      guide: "Señales intensas y cercanas, pero sin confirmar qué es ni nombrarla."
    manifestacion_parcial:
      show: [manifestations]
      guide: "Se deja ver en parte (un fragmento, una silueta, un efecto directo), sin nombrarla ni explicar qué es."
    presencia_directa:
      show: [description, manifestations]
      guide: "Presencia directa: se la ve y se la enfrenta, todavía sin nombrarla ni explicar del todo qué es."
    presencia_plena:
      show: [name, nature, description, manifestations, limits]
      guide: "Presencia plena: se muestra entera, con su nombre y su naturaleza."
    presencia:
      show: [name, nature, description, manifestations]
      guide: "Presencia abierta: el narrador sabe qué es y la nombra."
    revelacion:
      show: [name, nature, description, manifestations]
      guide: "Revelación: el narrador reconoce qué es (nombre, naturaleza, qué quiere)."
    confrontacion:
      show: [name, nature, description, manifestations, limits]
      guide: "Confrontación directa con la entidad."
    limites_consecuencias:
      show: [name, nature, manifestations, limits]
      guide: "Ya revelada: sus límites se ponen a prueba y se ven las consecuencias de lo que hizo."
    consecuencias:
      show: [name, nature, manifestations, limits]
      guide: "Consecuencias de su acción; sus límites se ponen en juego."
    huella:
      show: [name, manifestations]
      guide: "Huella: queda su marca o su rastro; no vuelve a mostrarse entera."
    segun_acto_5:
      show: [name, nature, manifestations]
      guide: "Lo decide el EVENTO de este acto: si la identifica, se la nombra; si no, queda ambigua y solo se ve su rastro."

  macro_beats:

    - id: 1
      name: "exposicion"
      word_limit: "entre 450 y 530 palabras"
      intent: "establecer normalidad y como cliffhanger para siguiente beat sembrar una inquietud sutil"
      intensity: baja
      must:
        - "presentar situacion base del narrador"
        - "introducir una anomalia sutil"
        - "incluir regla, advertencia o limite implicito"
      must_not: []
      # Spec-450 §2: reglas de revelación según el reveal_level de la entidad
      # principal. `default` = sin entidades y niveles sin override.
      reveal_rules:
        must_not:
          default: ["confirmar lo paranormal"]
          explicita: []
      state_change:
        from: "estabilidad"
        to: "incomodidad leve"
      success_signal:
        - "quien escucha el relato percibe que algo no encaja pero no sabe que"
      entity_exposure:
        nunca: senales
        insinuada: senales
        progresiva: senales
        explicita: presencia

    - id: 2
      name: "accion_ascendente"
      word_limit: "entre 450 y 530 palabras"
      intent: "activar el conflicto mediante transgresion"
      intensity: media
      must:
        - "romper la regla o ignorar la advertencia"
        - "mostrar un evento anomalo concreto"
        - "intentar explicacion racional"
      must_not: []
      reveal_rules:
        must_not:
          default: ["aceptar lo paranormal como hecho"]
          explicita: []
      state_change:
        from: "incomodidad"
        to: "inquietud concreta"
      success_signal:
        - "quien escucha el relato nota que el protagonista duda pero sigue dentro de una logica racional"
      entity_exposure:
        nunca: senales
        insinuada: manifestacion_parcial
        progresiva: manifestacion_parcial
        explicita: presencia

    - id: 3
      name: "climax"
      word_limit: "entre 450 y 530 palabras"
      intent: "forzar reconocimiento del horror"
      intensity: alta
      must:
        - "invalidar explicacion racional"
      reveal_rules:
        must:
          default: ["mostrar amenaza o presencia directa"]
          nunca: ["mostrar señales intensas de la amenaza sin confirmar qué es"]
      must_not:
        - "explicar origen o reglas completas del fenomeno"
      state_change:
        from: "negacion"
        to: "reconocimiento"
      success_signal:
        - "quien escucha el relato siente que el protagonista ya no puede negar lo que enfrenta"
      entity_exposure:
        nunca: senales_intensas
        insinuada: revelacion
        progresiva: presencia_directa
        explicita: confrontacion

    - id: 4
      name: "accion_descendente"
      word_limit: "entre 450 y 530 palabras"
      intent: "llevar al protagonista al colapso y reaccion"
      intensity: media-alta
      must:
        - "perdida de control o desorientacion"
        - "intento de escape o respuesta (instinto, fe, memoria)"
      must_not:
        - "resolución fácil del conflicto"
      state_change:
        from: "reconocimiento"
        to: "desesperacion"
      success_signal:
        - "quien escucha el relato siente que la situacion empeora antes de cualquier mejora"
      entity_exposure:
        nunca: senales
        insinuada: limites_consecuencias
        progresiva: presencia_plena
        explicita: consecuencias

    - id: 5
      name: "desenlace"
      word_limit: "entre 150 y 200 palabras (máxima brevedad emocional)"
      intent: "cerrar con brevedad emocional, escape incompleto y secuela"
      intensity: baja
      must:
        - "salida rapida o alejamiento del peligro"
        - "marca persistente o evidencia ambigua"
        - "reflexion final corta y contundente"
      must_not:
        - "cerrar completamente el misterio"
      state_change:
        from: "desesperacion"
        to: "calma inestable"
      success_signal:
        - "quien escucha el relato queda con la sensacion de que el horror no termino"
      entity_exposure:
        nunca: segun_acto_5
        insinuada: huella
        progresiva: huella
        explicita: huella
