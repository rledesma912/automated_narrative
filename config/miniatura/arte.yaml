# Spec-790: el arte común de todas las miniaturas (D6, D17). Lo que sale de los spikes de hoy
# (2026-11-23). Lo valida src/application/services/miniatura/arte.py al arrancar.
# Los textos de los prompts viven en prompts/<paso>.md; acá solo los números y los catálogos.

lienzo: { ancho: 1280, alto: 720, calidad_jpg: 90 }

# D21 / C1: las 4 opciones, una por plantilla, en este orden.
#   cx = centro de la figura (0–1 del ancho); alto = fracción del alto del cuadro;
#   recorte = qué parte de arriba de la figura se usa (1 = entera; < 1 = primer plano).
plantillas:
  A_der:          { nombre: "Figura a la derecha", cx: 0.70, alto: 0.92, recorte: 1.0 }
  A_izq:          { nombre: "Figura a la izquierda", cx: 0.30, alto: 0.92, recorte: 1.0 }
  C_primer_plano: { nombre: "Primer plano", cx: 0.68, alto: 1.0, recorte: 0.70 }
  B_lugar:        { nombre: "Manda el lugar", cx: 0.46, alto: 0.50, recorte: 1.0 }

# E3c: la curva de oscuridad del escenario antes de «fotografiarlo».
escenario: { gamma: 1.6, techo: 0.75, cambio_foto: 0.45 }

# E11 (T6.3): el personaje de Qwen sale como render de videojuego; Z-Image lo «fotografía».
# 0,45–0,55 les gustaron a Yael y al usuario; a 0,55 se pierde el boceto (hocico, esqueleto).
personaje: { cambio_foto: 0.50 }

# E4 ronda 2: la figura se oscurece según el lugar, se funde en una zona y se pega con máscara.
figura: { veces_el_lugar: 1.7, techo: 0.80, piso: 30, grano: 4, anillo: 0.04 }
fundido: { dilatacion: 0.01, borde: 16, margen: 0.12 }

# C5 / D23: el color. «desaturado» = la saturación media (de lo que no es negro) hasta `tope`
# (la mediana de las 36 recientes de Yael), sin tocar los acentos cálidos.
color: { tope_desaturado: 40 }

# D25: el tono sale del lugar, frío y desaturado, en toda la imagen. `lugares` = palabras que,
# si aparecen en «Cómo es el lugar», proponen ese tono. Halloween es la excepción (C5b): la
# figura en naranja y el fondo gris.
tonos:
  verde:
    nombre: "Verde (bosque, campo)"
    colores: [[4, 10, 6], [70, 92, 74], [205, 225, 208]]
    fuerza: 0.55
    lugares: [bosque, campo, selva, monte, maizal, pinos, cerro, sierra, montaña, granja, estancia]
  azul:
    nombre: "Azul (mar, agua)"
    colores: [[3, 6, 14], [62, 80, 108], [200, 214, 235]]
    fuerza: 0.55
    lugares: [mar, lago, laguna, río, playa, lluvia, barco, puerto, faro, océano, muelle, isla]
  gris_frio:
    nombre: "Gris frío (casa, pueblo, ciudad)"
    colores: [[5, 7, 9], [80, 88, 94], [215, 222, 228]]
    fuerza: 0.55
    lugares: []
  halloween:
    nombre: "Halloween (la figura en naranja)"
    colores: [[18, 6, 2], [160, 72, 30], [255, 214, 170]]
    fuerza: 0.85
    figura: true
    lugares: [halloween]
tono_por_defecto: gris_frio
