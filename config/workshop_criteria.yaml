# Spec-530 §4: criterios del taller del asistente de autoría.
#
# Fuente única: la UI muestra `nombre` y `por_que` (Spec-550 H7: `{protagonista}`
# se reemplaza por el nombre del protagonista); el Consultor recibe solo
# `pregunta` (la pregunta operativa). La teoría de la que sale cada criterio
# (`origen`) es documentación: nunca va al prompt (Spec-530 §1.2).
#
# El orden es el orden en que se muestran y se evalúan.

direccion:
  - id: meta
    nombre: Qué busca {protagonista}
    pregunta: ¿Qué quiere el protagonista en esta historia, algo concreto que la amenaza pueda frustrar?
    por_que: "Lo que {protagonista} quiere conseguir en esta historia: llegar a destino, cobrar el viaje, proteger a alguien. El miedo crece cuando la amenaza se interpone en eso."
    origen: Swain / McKee

  - id: en_juego
    nombre: Qué arriesga {protagonista}
    pregunta: ¿Qué pierde el protagonista si la amenaza sigue (trabajo, vida, cordura, alguien querido)?
    por_que: "Lo que {protagonista} pierde si la amenaza gana: el trabajo, la cordura, a alguien querido. Si no arriesga nada, quien escucha no teme por él."
    origen: McKee

  - id: vulnerabilidad
    nombre: Qué expone a {protagonista}
    pregunta: ¿Qué hace o cree el protagonista que lo deja expuesto a la amenaza?
    por_que: "Algo que {protagonista} hace o cree que lo deja a merced de la amenaza. Si le pasa por algo suyo, el miedo pesa más que si le pasa por azar."
    origen: Hamartia (Aristóteles)

  - id: historia_secreta
    nombre: La historia secreta
    pregunta: ¿Hay algo oculto que explique por qué la amenaza lo busca a él (un vínculo, una culpa, un secreto)?
    por_que: "Lo que no se ve al principio y explica por qué le pasa a {protagonista}: un vínculo, una culpa, un secreto."
    origen: Piglia, «Tesis sobre el cuento»

  - id: final
    nombre: El final
    pregunta: ¿El final deja una marca coherente con el efecto que busca el autor?
    por_que: "Si el final deja en quien escucha la marca que buscás (el efecto de la Dirección)."
    origen: Poe (unidad de efecto) / residuo
