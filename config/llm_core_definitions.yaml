version: "1.1"

# ── Perfil activo ────────────────────────────────────────────────────────────
#
# Override: variable de entorno LLM_PROFILE pisa este valor.
# Precedencia: env LLM_PROFILE → active_profile (YAML) → fallback ollama-natsumura.
#
# Para cambiar de modelo basta con editar esta línea o exportar LLM_PROFILE.
# Cada perfil trae su provider y sus 3 roles completamente definidos.

active_profile: ollama-gemma3-12b

# ── Perfiles pre-configurados ────────────────────────────────────────────────
#
# Convención: el `model` que se envía al LLM vive SIEMPRE en
# `profiles.<perfil>.roles.<rol>.model`. Los bloques `ollama`/`anthropic`/`gemini`
# solo aportan settings de transporte (host, cli_command) y un default de
# fallback por adapter.
#
profiles:

  ollama-qwen25-14b:
    prompt_variant: compact
    prompting_strategy: assertive
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      story_analyst:
        model: qwen2.5:14b
        temperature: 0.3
        num_ctx: 6144
        num_predict: 700
        stop: []
      director:
        model: qwen2.5:14b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 1500
        stop: []
      voz:
        model: qwen2.5:14b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 1500
        stop: []
      journal:
        model: qwen2.ollama-gemma3-12b5:14b
        temperature: 0.3
        num_ctx: 6144
        num_predict: 500
        stop: []

  ollama-llama31:
    prompt_variant: compact
    prompting_strategy: assertive
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      story_analyst:
        model: llama3.1:8b
        temperature: 0.3
        num_ctx: 2048
        num_predict: 500
        stop: ["###", "---\n"]
      director:
        model: llama3.1:8b
        temperature: 0.4
        num_ctx: 4096
        num_predict: 512
        stop: ["###", "---\n"]
      voz:
        model: llama3.1:8b
        temperature: 0.6
        num_ctx: 4096
        num_predict: 1000
        stop: ["###", "---\n"]
      journal:
        model: mistral:latest
        temperature: 0.3
        num_ctx: 2048
        num_predict: 256
        stop: []

  ollama-qwen3-8b:
    prompt_variant: compact
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      story_analyst:
        model: qwen3:8b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 500
        stop: []
      director:
        model: qwen3:8b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 700
        stop: []
      voz:
        model: qwen3:8b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 1000
        stop: []
      journal:
        model: qwen3:8b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []

  ollama-hybrid-voz-qwen3:
    prompt_variant: compact
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      story_analyst:
        model: qwen2.5:14b
        temperature: 0.3
        num_ctx: 6144
        num_predict: 700
        stop: []
      director:
        model: qwen2.5:14b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 700
        stop: []
      voz:
        model: qwen3:8b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 2000
        stop: []
      journal:
        model: qwen2.5:14b
        temperature: 0.3
        num_ctx: 3072
        num_predict: 256
        stop: []

  ollama-gemma3-12b:
    prompt_variant: compact
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      story_analyst:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 500
        stop: []
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        model: gemma3:12b
        temperature: 0.6
        num_ctx: 8192
        num_predict: 1000
        stop: []
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []

  # Spec-480 (EV-2): perfil híbrido. Analyst, Mapper y Journal como `ollama-gemma3-12b`;
  # la Voz en Claude Sonnet 5 (`provider` por rol → RoleRoutingAdapter). Cuesta ~US$ 0,08
  # por relato sin pensamiento (~US$ 0,13 con `thinking: adaptive`). NO está activo:
  # evaluarlo antes con `scripts/evaluate_voice.py --profile … --yes`.
  # Sonnet 5 no acepta temperature (el adapter la omite) y piensa si se omite `thinking`.
  ollama-gemma3-12b-voz-sonnet5:
    prompt_variant: compact
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    anthropic: { model: claude-sonnet-5 }
    roles:
      story_analyst:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 500
        stop: []
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        provider: anthropic
        model: claude-sonnet-5
        num_predict: 2000
        thinking: disabled   # adaptive: planifica cada acto (~60% más caro)
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []

  gemini-cli:
    prompt_variant: frontier
    provider: gemini
    prompting_strategy: assertive
    gemini: { cli_command: gemini, model: gemini-2.5-flash }
    roles:
      story_analyst:
        model: gemini-2.5-flash
        temperature: 0.3
        num_predict: 600
      director:
        model: gemini-2.5-flash
        temperature: 0.4
      voz:
        model: gemini-2.5-flash
        temperature: 0.6
      journal:
        model: gemini-2.5-flash
        temperature: 0.3

# ── Filtros de respuesta (transversales a todos los perfiles) ────────────────

response_filters:
  thinking_tags:
    - think
    - thought
    - reasoning

  strip_line_patterns:
    - "^Aquí tienes"
    - "^A continuación"
    - "^Espero que te guste"
    - "^Por supuesto"
    - "^Claro[,!.]"

  preserve_paragraph_breaks: true

  model_overrides:
    deepseek-r1:
      strip_thinking: true
    qwen2.5:
      strip_thinking: false
    natsumura:
      strip_thinking: false
