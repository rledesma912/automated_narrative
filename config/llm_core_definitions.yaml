version: "1.1"

# ── Perfil activo ────────────────────────────────────────────────────────────
#
# Override: variable de entorno LLM_PROFILE pisa este valor.
# Precedencia: env LLM_PROFILE → active_profile (YAML).
#
# Dos perfiles (2026-09-27): el local (gemma3:12b, activo) y uno genérico con Claude.
#
# Para cambiar de modelo basta con editar esta línea o exportar LLM_PROFILE.
# Cada perfil trae su provider y sus roles (director = base de consultor, planificador
# y verificador cuando el perfil no los declara; voz; journal).

active_profile: ollama-gemma3-12b

# ── Perfiles pre-configurados ────────────────────────────────────────────────
#
# Convención: el `model` que se envía al LLM vive SIEMPRE en
# `profiles.<perfil>.roles.<rol>.model`. Los bloques `ollama`/`anthropic`/`gemini`
# solo aportan settings de transporte (host, cli_command) y un default de
# fallback por adapter.
#
profiles:

  ollama-gemma3-12b:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    # Spec-510: valor inicial de la duración estimada (s), medido 2026-09-24
    # (relato completo 206 s, regenerar un acto 22 s). Con historial manda la mediana.
    estimated_seconds: { full_generation: 210, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        model: gemma3:12b
        temperature: 0.6
        num_ctx: 8192
        num_predict: 1800  # Spec-590 D: hasta 900 palabras (~1,6 tokens por palabra)
        stop: []
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []
      # Spec-530: asistente de autoría (salida JSON con esquema). Medido con
      # «la pena del colectivo»: análisis ~35 s, escaleta ~45 s.
      consultor:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 8192
        num_predict: 1500
        stop: []
      planificador:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 2500
        stop: []
      verificador:
        model: gemma3:12b
        temperature: 0.2
        num_ctx: 8192
        num_predict: 1200
        stop: []

  # Perfil genérico con Claude: todos los roles en Claude Sonnet 5 (Spec-480, 2026-09-27).
  # NO está activo: es para comparar con un LLM frontier cuando termine el ajuste para el
  # modelo local. Cada rol puede ir a otro proveedor con `provider` (RoleRoutingAdapter).
  # Sonnet 5 no acepta temperature (el adapter la omite) y piensa si se omite `thinking`.
  anthropic-sonnet5:
    provider: anthropic
    anthropic: { model: claude-sonnet-5 }
    # Spec-510: sin medir; mismos valores que gemma3 hasta tener historial.
    estimated_seconds: { full_generation: 210, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: claude-sonnet-5
        num_predict: 2000
        thinking: disabled
      voz:
        model: claude-sonnet-5
        num_predict: 2500  # Spec-590 D: actos de hasta 900 palabras, con margen
        thinking: disabled   # adaptive: planifica cada acto (~60% más caro)
      journal:
        model: claude-sonnet-5
        num_predict: 1000
        thinking: disabled
      consultor:
        model: claude-sonnet-5
        num_predict: 3000
        thinking: disabled
      planificador:
        model: claude-sonnet-5
        num_predict: 4000
        thinking: disabled
      verificador:
        model: claude-sonnet-5
        num_predict: 2000
        thinking: disabled

# ── Filtros de respuesta (transversales a todos los perfiles) ────────────────

response_filters:
  thinking_tags:
    - think
    - thought
    - reasoning

  strip_line_patterns:
    - "^Aquí tienes"
    - "^A continuación"
    - "^Espero que te guste"
    - "^Por supuesto"
    - "^Claro[,!.]"

  preserve_paragraph_breaks: true

  # Por substring del modelo (Spec-080). Los de modelos que ya no se usan se quitaron
  # (2026-09-27): gemma3 y Sonnet 5 no necesitan ajustes.
  model_overrides: {}
