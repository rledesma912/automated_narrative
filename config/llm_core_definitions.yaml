# ── Filtros de respuesta (transversales a todos los perfiles) ────────────────

response_filters:
  thinking_tags:
    - think
    - thought
    - reasoning

  strip_line_patterns:
    - "^Aquí tienes"
    - "^A continuación"
    - "^Espero que te guste"
    - "^Por supuesto"
    - "^Claro[,!.]"

  preserve_paragraph_breaks: true

  model_overrides:
    deepseek-r1:
      strip_thinking: true
    qwen2.5:
      strip_thinking: false
    natsumura:
      strip_thinking: false
