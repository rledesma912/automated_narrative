version: "1.1"

# ── Perfil activo ────────────────────────────────────────────────────────────
#
# Override: variable de entorno LLM_PROFILE pisa este valor.
# Precedencia: env LLM_PROFILE → active_profile (YAML) → fallback ollama-natsumura.
#
# Para cambiar de modelo basta con editar esta línea o exportar LLM_PROFILE.
# Cada perfil trae su provider y sus roles (director = base de consultor, planificador
# y verificador cuando el perfil no los declara; voz; journal).

active_profile: ollama-gemma3-12b

# ── Perfiles pre-configurados ────────────────────────────────────────────────
#
# Convención: el `model` que se envía al LLM vive SIEMPRE en
# `profiles.<perfil>.roles.<rol>.model`. Los bloques `ollama`/`anthropic`/`gemini`
# solo aportan settings de transporte (host, cli_command) y un default de
# fallback por adapter.
#
profiles:

  ollama-qwen25-14b:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      director:
        model: qwen2.5:14b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 1500
        stop: []
      voz:
        model: qwen2.5:14b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 1500
        stop: []
      journal:
        model: qwen2.5:14b
        temperature: 0.3
        num_ctx: 6144
        num_predict: 500
        stop: []

  ollama-llama31:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      director:
        model: llama3.1:8b
        temperature: 0.4
        num_ctx: 4096
        num_predict: 512
        stop: ["###", "---\n"]
      voz:
        model: llama3.1:8b
        temperature: 0.6
        num_ctx: 4096
        num_predict: 1000
        stop: ["###", "---\n"]
      journal:
        model: mistral:latest
        temperature: 0.3
        num_ctx: 2048
        num_predict: 256
        stop: []

  ollama-qwen3-8b:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      director:
        model: qwen3:8b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 700
        stop: []
      voz:
        model: qwen3:8b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 1000
        stop: []
      journal:
        model: qwen3:8b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []

  ollama-hybrid-voz-qwen3:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    roles:
      director:
        model: qwen2.5:14b
        temperature: 0.4
        num_ctx: 6144
        num_predict: 700
        stop: []
      voz:
        model: qwen3:8b
        temperature: 0.6
        num_ctx: 6144
        num_predict: 2000
        stop: []
      journal:
        model: qwen2.5:14b
        temperature: 0.3
        num_ctx: 3072
        num_predict: 256
        stop: []

  ollama-gemma3-12b:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    # Spec-510: valor inicial de la duración estimada (s), medido 2026-09-24
    # (relato completo 206 s, regenerar un acto 22 s). Con historial manda la mediana.
    estimated_seconds: { full_generation: 210, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        model: gemma3:12b
        temperature: 0.6
        num_ctx: 8192
        num_predict: 1000
        stop: []
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []
      # Spec-530: asistente de autoría (salida JSON con esquema). Medido con
      # «la pena del colectivo»: análisis ~35 s, escaleta ~45 s.
      consultor:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 8192
        num_predict: 1500
        stop: []
      planificador:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 2500
        stop: []
      verificador:
        model: gemma3:12b
        temperature: 0.2
        num_ctx: 8192
        num_predict: 1200
        stop: []

  # Spec-480 (EV-2): perfil híbrido. Analyst, Mapper y Journal como `ollama-gemma3-12b`;
  # la Voz en Claude Sonnet 5 (`provider` por rol → RoleRoutingAdapter). Cuesta ~US$ 0,08
  # por relato sin pensamiento (~US$ 0,13 con `thinking: adaptive`). NO está activo:
  # evaluarlo antes con `scripts/evaluate_voice.py --profile … --yes`.
  # Sonnet 5 no acepta temperature (el adapter la omite) y piensa si se omite `thinking`.
  ollama-gemma3-12b-voz-sonnet5:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    anthropic: { model: claude-sonnet-5 }
    # Spec-510: sin medir con la Voz en Claude; mismos valores que gemma3 hasta tener historial.
    estimated_seconds: { full_generation: 210, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        provider: anthropic
        model: claude-sonnet-5
        num_predict: 2000
        thinking: disabled   # adaptive: planifica cada acto (~60% más caro)
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []
      # Spec-530: asistente de autoría (salida JSON con esquema). Medido con
      # «la pena del colectivo»: análisis ~35 s, escaleta ~45 s.
      consultor:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 8192
        num_predict: 1500
        stop: []
      planificador:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 2500
        stop: []
      verificador:
        model: gemma3:12b
        temperature: 0.2
        num_ctx: 8192
        num_predict: 1200
        stop: []

  gemini-cli:
    provider: gemini
    gemini: { cli_command: gemini, model: gemini-2.5-flash }
    roles:
      director:
        model: gemini-2.5-flash
        temperature: 0.4
      voz:
        model: gemini-2.5-flash
        temperature: 0.6
      journal:
        model: gemini-2.5-flash
        temperature: 0.3

# ── Filtros de respuesta (transversales a todos los perfiles) ────────────────

response_filters:
  thinking_tags:
    - think
    - thought
    - reasoning

  strip_line_patterns:
    - "^Aquí tienes"
    - "^A continuación"
    - "^Espero que te guste"
    - "^Por supuesto"
    - "^Claro[,!.]"

  preserve_paragraph_breaks: true

  model_overrides:
    deepseek-r1:
      strip_thinking: true
    qwen2.5:
      strip_thinking: false
    natsumura:
      strip_thinking: false
