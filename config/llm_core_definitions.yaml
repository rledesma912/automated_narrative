version: "1.1"

# ── Perfil activo ────────────────────────────────────────────────────────────
#
# Override: variable de entorno LLM_PROFILE pisa este valor.
# Precedencia: env LLM_PROFILE → active_profile (YAML).
#
# Tres perfiles: el local (gemma3:12b, activo en el YAML), el híbrido (Spec-600: la Voz en
# Claude Sonnet 5.5 y el resto local; activo en dev con LLM_PROFILE) y uno todo en Claude.
#
# Para cambiar de modelo basta con editar esta línea o exportar LLM_PROFILE.
# Cada perfil trae su provider y sus roles (director = base de consultor, planificador
# y verificador cuando el perfil no los declara; voz; journal).

active_profile: ollama-gemma3-12b

# ── Perfiles pre-configurados ────────────────────────────────────────────────
#
# Convención: el `model` que se envía al LLM vive SIEMPRE en
# `profiles.<perfil>.roles.<rol>.model`. Los bloques `ollama`/`anthropic`/`gemini`
# solo aportan settings de transporte (host, cli_command) y un default de
# fallback por adapter.
#
profiles:

  ollama-gemma3-12b:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    # Spec-510: valor inicial de la duración estimada (s), medido 2026-09-24
    # (relato completo 206 s, regenerar un acto 22 s). Con historial manda la mediana.
    # Spec-590: actos más largos → relato completo 268 y 302 s en dev (2026-09-30).
    estimated_seconds: { full_generation: 285, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        model: gemma3:12b
        temperature: 0.6
        num_ctx: 8192
        num_predict: 1800  # Spec-590 D: hasta 900 palabras (~1,6 tokens por palabra)
        stop: []
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []
      # Spec-530: asistente de autoría (salida JSON con esquema). Medido con
      # «la pena del colectivo»: análisis ~35 s, escaleta ~45 s.
      consultor:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 8192
        num_predict: 1500
        stop: []
      planificador:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 2500
        stop: []
      verificador:
        model: gemma3:12b
        temperature: 0.2
        num_ctx: 8192
        num_predict: 1200
        stop: []

  # Spec-600: la Voz en Claude Sonnet 5.5 y el resto en gemma3:12b (ruteo por rol,
  # Spec-480). Los roles locales son los de `ollama-gemma3-12b`, tal cual.
  # La Voz piensa poco (adaptativo, effort `low`: lo que recomienda la doc para generar
  # contenido); sin pensar del todo sería `thinking: between_tools` (Sonnet 5.5 rechaza
  # `disabled`). Sonnet 5.5 no acepta temperature (el adapter la omite).
  hibrido-sonnet55:
    provider: ollama
    ollama: { host: "http://localhost:11434" }
    anthropic: { model: claude-sonnet-5-5 }
    # Spec-510: valores iniciales sin medir (la Voz en Claude tarda menos; la Memoria
    # sigue local). Con historial manda la mediana.
    estimated_seconds: { full_generation: 180, regenerate_voz: 25, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 700
        stop: []
      voz:
        provider: anthropic
        model: claude-sonnet-5-5
        num_predict: 2500
        thinking: adaptive
        effort: low
      journal:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 4096
        num_predict: 256
        stop: []
      consultor:
        model: gemma3:12b
        temperature: 0.3
        num_ctx: 8192
        num_predict: 1500
        stop: []
      planificador:
        model: gemma3:12b
        temperature: 0.4
        num_ctx: 8192
        num_predict: 2500
        stop: []
      verificador:
        model: gemma3:12b
        temperature: 0.2
        num_ctx: 8192
        num_predict: 1200
        stop: []

  # Todo en Claude Sonnet 5.5 (Spec-480; Spec-600). NO está activo: sirve para comparar y
  # como palanca si hiciera falta mover otro rol (p. ej. el Planificador).
  # Sin pensar = `between_tools` (Sonnet 5.5 rechaza `disabled`).
  anthropic-sonnet55:
    provider: anthropic
    anthropic: { model: claude-sonnet-5-5 }
    # Spec-510: sin medir; manda el historial.
    estimated_seconds: { full_generation: 150, regenerate_voz: 20, consult: 20, plan_outline: 60, verify_outline: 15 }
    roles:
      director:
        model: claude-sonnet-5-5
        num_predict: 2000
        thinking: between_tools
      voz:
        model: claude-sonnet-5-5
        num_predict: 2500
        thinking: adaptive
        effort: low
      journal:
        model: claude-sonnet-5-5
        num_predict: 1000
        thinking: between_tools
      consultor:
        model: claude-sonnet-5-5
        num_predict: 3000
        thinking: between_tools
      planificador:
        model: claude-sonnet-5-5
        num_predict: 4000
        thinking: between_tools
      verificador:
        model: claude-sonnet-5-5
        num_predict: 2000
        thinking: between_tools

# ── Filtros de respuesta (transversales a todos los perfiles) ────────────────

response_filters:
  thinking_tags:
    - think
    - thought
    - reasoning

  strip_line_patterns:
    - "^Aquí tienes"
    - "^A continuación"
    - "^Espero que te guste"
    - "^Por supuesto"
    - "^Claro[,!.]"

  preserve_paragraph_breaks: true

  # Por substring del modelo (Spec-080). Los de modelos que ya no se usan se quitaron
  # (2026-09-27): gemma3 y Sonnet 5 no necesitan ajustes.
  model_overrides: {}
