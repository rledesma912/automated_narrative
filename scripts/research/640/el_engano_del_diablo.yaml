  bridge: Llegan a una estación de servicio y el empleado les revela la verdad.
  goal: Comprender lo sucedido y escapar de la experiencia, pero la verdad es más aterradora de lo que
    imaginaban.
  events:
  - El empleado de la estación de servicio les dice, sorprendido, que estaban en la cueva de la salamanca.
