- number: 2
  bridge: La noche cae sobre el campamento. Después de la cena, Carlos se aleja del fuego.
  goal: Susana y los demás intentan ayudar a encontrar al niño perdido, pero terminan transigiendo al
    entrar en la cueva.
  events:
  - Carlos se aleja del campamento, nervioso, diciendo que necesita aire.
  - 'Carlos regresa corriendo, alterado, y les cuenta que una mujer le pidió ayuda: su hijo se habría
    perdido en una cueva cercana.'
  - La mujer no está en el lugar donde Carlos la vio, pero se escucha el llanto de un niño proveniente
    de una cueva oscura.
  - Susana, impulsada por la curiosidad y la necesidad de ayudar, insiste en entrar a buscar al niño.
  - Entran a la cueva, perdiéndose entre túneles oscuros y húmedos, siguiendo el llanto.
  change_from: Calma en el campamento, ambiente festivo.
  change_to: Tensión y oscuridad dentro de la cueva, con el llanto del niño como única guía.
