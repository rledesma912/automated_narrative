  bridge: ''
  goal: Susana quiere conocer el trabajo de su tío y acampar en el monte, a pesar de la inquietud que
    le genera el comentario del tío.
  events:
  - Susana convence a su tío Rubén de llevarla al monte donde trabajaran
  - Rubén acepta a cambio de que al regresar le cocine su comida favorita, pastel de papas.
  - 'Antes de irse, Rubén le dice a Susana: ''El clima va a cambiar, andá preparada''.'
  - Llegan al monte en la vieja camioneta de Rubén, con Carlos y Juan como compañeros.
  - Montan el campamento y Rubén le muestra a Susana cómo trabajan y como armar el campamento.
  change_from: Susana está en casa de su tio con ganas de acompañarlo al monte
  change_to: Susana está en el monte, con ganas de una aventura en el monte.
