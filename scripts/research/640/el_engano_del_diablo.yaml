atmosfera: folk_horror (mitologia_regional)
escenarios: ''
sinopsis: |-
  susana cuenta la historia de cuando adolescente acompaño a su tio ruben y 2 compañeros de él , a pasar unos dias en el monte salvaje para trabajar como posteros. llegaron en la vieja camioneta del tio. una noche hicieron una fogata y en un momemto, carlos, uno de los compañeros, se alejo del campamento y volvio nervioso diciendo que una señora le pidio ayuda porque su pequeño hijo se habia perdido en una cueva. todos salieron en su ayuda,cuando llegaron la mujer no estaba ,pero escucharon el llanto de un niño dentro de la cueva. entonces entraron, se perdieron entre tuneles  buscando el origen del llanto. finalmente en una caverna con una sola entrada se encontraron con un pequeño de espaldas, quien se dio vuelta y lanzando una carcajada mostro su rostro demoniaco. la cueva entro en llamas y el grupo huyo despavorido como pudo. al volver al campamento, intentaron escapar en la chata pero no pudieron arrancarla y se quedaron despiertos toda la noche. al amanecer pudieron arrancar la chata y pasaron por el  lugar donde estaba la cueva pero alli no habia nada. se fueron sin comprender el hecho paranormal. al llegar a una estacion de servicio, entre charlas,  el que atiende les pregunto de donde venian y cuando ellos le dijeron del lugar, el hombre se asombro y les dijo que estuvieron en la cueva de la salamanca.
