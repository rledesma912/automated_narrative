- number: 2
  bridge: Una semana después, la familia empieza a notar cosas extrañas en el patio de su casa. El ambiente
    se torna tenso y la tranquilidad se rompe.
  goal: Tito intenta entender lo que está pasando y se enfrenta a la amenaza que se cierne sobre su familia.
  events:
  - La familia encuentra huellas extrañas en el patio, demasiado grandes para ser de un perro.
  - Los perros del vecino ladran incesantemente hacia la laguna, como si estuvieran advirtiendo de algo.
  - Tito ve una figura oscura acechando entre los árboles, pero al acercarse, la figura desaparece.
  - Una noche, un fuerte golpe despierta a la familia. Al salir, ven que algo grande ha destrozado la
    cerca del patio.
  - La familia se altera, la criatura intenta ingresar a la casa
  - el padre de tito se defiende cara a cara con la criatura y la hiere
  - la criatura se aleja con alaridos
