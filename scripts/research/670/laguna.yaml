outline:
- number: 1
  bridge: ''
  goal: Tito intenta adaptarse a su nueva vida, pero la inquietud que le genera la laguna lo consume.
  events:
  - Tito escucha a Don Raúl, un vecino, hablar sobre la laguna oscura. Le cuenta que es peligroso andar
    por ahí de noche.
  - Tito intenta convencer a sus padres para que lo lleven a explorar la laguna, pero ellos se niegan,
    diciendo que es mejor evitarla.
  - Tito se asoma por la ventana y ve una sombra moverse cerca de la laguna, pero cuando enfoca la vista,
    no ve nada.
  change_from: Tito se siente seguro en su nueva casa, aunque algo le incomoda.
  change_to: Tito siente una creciente inquietud y desconfianza hacia la laguna oscura.
