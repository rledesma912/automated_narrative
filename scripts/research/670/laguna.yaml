sinopsis: |-
  En una zona aislada de los bosques patagónicos, una familia comienza a encontrar rastros de una criatura legendaria que, según los lugareños, habita en una oscura laguna cercana. Cuando el ser irrumpe una noche en el patio de su casa, la familia descubre que algo lo ha obligado a abandonar las profundidades y buscar alimento en tierra firme. La aparición de una fábrica junto a la laguna y la misteriosa muerte de los peces revelan una posible causa, pero mientras la actividad industrial continúa, nadie sabe qué es realmente la criatura ni cuánto tiempo podrá permanecer bajo el agua antes de volver a salir a cazar.
