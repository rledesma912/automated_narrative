sinopsis: |-
  El conductor cuenta como trabaja largas horas y distancias entre estaciones y cuenta que en el micro desafortunadamente falleció una mujer en circunstancias poco claras. Cuenta que José es una persona que trabaja en turnos nocturnos y que muchas veces compañeros le contaron hechos paranormales pero que a él nunca le había tocado hasta el momento nada semejante.

  En una noche muy oscura en la terminal de un pueblo queda sólo y no hay pasajeros para la vuelta. Él sube al micro y por el espejo retrovisor ve en varias ocasiones una mujer de pelo atado en distintos asientos pero cuando gira la persona o entidad desaparece. El momento más tenso es cuando ve en el espejo al espiritu solo a centimetros de él y siente que le tocan el hombro.

  La entidad lo toca una segunda vez pero en el rostro haciendo que José se asuste y y pierda el control del micro por lo que descarrila de la ruta pero finalmente puede puede controlar el vehículo sin sufrir un accidente grave.

  José asustado baja del micro horrorizado por descarrilar y se da cuenta que donde sucede el acto es el lugar donde la mujer murió ya que hay un pedestal en su nombre con una foto que es identica a la mujer que veia a traves del espejo retrovisor del micro.

  José vuelve a pasar a los días por el lugar, detiene el micro y baja para dejar unas flores en el improvisado pedestal. A partir de allí no vuelve a ver a la entidad e imagina que de alguna manera presentar respetos al espiritu de la mujer hizo que su alma se vaya en paz o al menos no se le presente más.
reglas:
- El micro siempre presenta casos paranormales cuando el conductor está solo.
