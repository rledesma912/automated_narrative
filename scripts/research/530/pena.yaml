escenarios: 'El interior del micro: Es un micro moderno que realiza largas distancias, está bien equipado
  pero es oscuro. Tiene televisores donde se transmiten películas para los pasajeros.; La estación principal
  de un pueblos alejado.: Es desolada y poco frecuentada. Es antigua y le falta reparaciones, es oscura.
