direction:
  premise: 'Un camionero que viaja de madrugada por una ruta rodeada de bosque sufre
    una avería justo en una zona donde su empresa tiene una regla clara: nunca detenerse
    allí. Al bajar del camión, empieza a ver numerosas siluetas humanas entre los
    árboles, todas iguales, con ojos brillantes y extrañas astas de ciervo. Son hostiles
    y comienzan a acercarse lentamente, obligándolo a escapar por la carretera. El
    camionero, que además no está en buen estado físico, corre desesperadamente hacia
    un pequeño pueblo que acaba de dejar atrás.'
  effect: pavor
  effect_other: ''
  ending: 'El camionero logra llegar al almacén del pueblo y cuenta lo ocurrido. El
    hombre que atiende parece conocer la zona y le pregunta: “¿Viste cuántos eran?”.
    El camionero responde que eran muchos. Entonces le pregunta: “¿Y todos tenían
    astas?”. Cuando el camionero asiente, el hombre responde: “Entonces todavía no
    salieron del bosque”. Poco después llega el rescate, recuperan el camión y la
    historia queda sin explicación. El camionero continúa trabajando, pero desde entonces
    jamás se detiene en ese tramo.'
  ending_intentional: true
