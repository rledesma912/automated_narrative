atmosfera: folk_horror (rural)
escenarios: ''
sinopsis: 'Un camionero que viaja de madrugada por una ruta rodeada de bosque sufre
  una avería justo en una zona donde su empresa tiene una regla clara: nunca detenerse
  allí. Al bajar del camión, empieza a ver numerosas siluetas humanas entre los árboles,
  todas iguales, con ojos brillantes y extrañas astas de ciervo. Son hostiles y comienzan
  a acercarse lentamente, obligándolo a escapar por la carretera. El camionero, que
  además no está en buen estado físico, corre desesperadamente hacia un pequeño pueblo
  que acaba de dejar atrás.'
