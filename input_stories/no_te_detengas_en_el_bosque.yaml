  synopsis: ''
- number: 2
  bridge: Leonardo pasa un par de horas intentando arreglar el camión, sin éxito. La noche avanza y la
    tensión aumenta.
  goal: Intentar arreglar el camión o buscar ayuda.
  events:
  - Leonardo intenta usar el celular para pedir ayuda, pero no hay señal.
  - Leonardo baja del camión para inspeccionar el motor, sintiéndose frustrado y preocupado.
  - Mientras camina alrededor del camión, Leonardo ve movimientos entre los árboles. Al principio, piensa
    que es su imaginación.
  - Leonardo se da cuenta de que hay numerosas siluetas humanas entre los árboles, todas iguales, con
    ojos brillantes.
  - Las siluetas empiezan a acercarse lentamente al camión, y Leonardo siente un miedo irracional. Se
    empiezan a escuchar ruidos como de susurros, como si se hablaran entre sí, pero Leonardo no entiende
    ni una palabra.
  - Leonardo tiene tanto miedo que se sube al camión y se refugia ahí, pero rápidamente lo rodean.
  - Una entidad le rompe una ventana y pedazos de vidrio se le meten en el oído a Leonardo. Leonardo sale
    por la otra puerta, con esfuerzo, y decide salir corriendo de ahí, antes de que entren.
  change_from: Leonardo intenta solucionar el problema mecánico, sintiéndose frustrado.
  change_to: Leonardo huye despavorido de unas figuras amenazantes en el bosque.
  scenario: Ruta del Bosque del Silencio
  on_stage:
  - Leonardo
  held_back: La naturaleza exacta de las siluetas y por qué se acercan a Leonardo.
  reveal_act: 3
  seeds:
