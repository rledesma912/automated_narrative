outline:
- number: 1
  bridge: ''
  goal: Entregar el cargamento a tiempo.
  events:
  - Leonardo revisa el GPS y confirma que está entrando en el tramo del Bosque del Silencio.
  - El motor del camión empieza a toser y pierde potencia. Leonardo intenta acelerar, pero no responde.
  - El camión se detiene por completo en medio del bosque, en un lugar oscuro y aislado.
  - Leonardo intenta arrancar el camión, pero es inútil. La radio no funciona.
  change_from: Leonardo está cumpliendo su trabajo, sintiéndose presionado por la urgencia del cargamento.
  change_to: Leonardo está varado en un lugar peligroso, con un camión averiado y sin comunicación.
  scenario: Ruta del Bosque del Silencio
  on_stage:
  - Leonardo
  held_back: La razón por la que el jefe le advirtió a Leonardo sobre el Bosque del Silencio.
  reveal_act: 2
  seeds:
  - La insistencia del jefe en evitar el Bosque del Silencio.
  - La oscuridad y el aislamiento del lugar donde se avería el camión.
