- number: 3
  bridge: A Leonardo no le queda otra opción más que correr por la carretera, con las siluetas persiguiéndolo
    muy cerca. No corren, pero siempre están cerca.
  goal: Alejarse de las siluetas y encontrar un lugar seguro.
  events:
  - Leonardo recuerda que, en el camión, había pasado un pueblo hacía poco y decide dirigirse hacia allí,
    esperando encontrar ayuda.
  - Al acercarse al pueblo, Leonardo observa que las siluetas están cada vez más cerca, a pesar de que
    nunca las ve corriendo.
  - Leonardo se detiene en la entrada del pueblo, exhausto y con problemas para respirar. Las siluetas
    están en el bosque, pero no parecen cruzar hacia el pueblo.
  - 'Leonardo se da cuenta de que las siluetas no son del todo humanas: tienen cuernos en la cabeza y
    los ojos son muy brillantes. El cuerpo es con forma humana.'
  - Leonardo corre desesperadamente hacia el almacén del pueblo. Nota que ya no lo persiguen.
  change_from: Leonardo intenta escapar de las siluetas, sintiéndose cada vez más desesperado.
