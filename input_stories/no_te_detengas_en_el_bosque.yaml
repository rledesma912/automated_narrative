- number: 4
  bridge: Leonardo entra al almacén, jadeando y con el rostro pálido. El hombre que atiende lo mira con
    curiosidad.
  goal: Contar lo sucedido y buscar ayuda.
  events:
  - Leonardo le cuenta al hombre del almacén lo que ha visto y vivido en el bosque.
  - El hombre escucha atentamente, sin mostrar sorpresa ni incredulidad.
  - Leonardo siente que su respiración se agrava, y se apoya en la barra del almacén para no caer.
  - 'El hombre le pregunta: “¿Viste cuántos eran?”'
  - Leonardo responde que eran muchos.
  - 'El hombre le pregunta: “¿Y todos tenían astas?”.'
  - Leonardo dice que no está seguro, pero cree que sí.
  - 'El hombre responde: “Entonces no tenemos de qué preocuparnos”.'
