services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT:-3100}:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - SITE_TITLE=${SITE_TITLE:-Narrative Builder}
      - OUTPUT_DIR=/app/output_stories
      - DEFAULT_TOTAL_ACTS=${DEFAULT_TOTAL_ACTS:-5}
    volumes:
      - ./frontend/output_stories:/app/output_stories
      - ./prompt_generacion:/app/prompt_generacion:ro
      - ./prompts_saneadores:/app/prompts_saneadores:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
