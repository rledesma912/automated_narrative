services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT:-3100}:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - SITE_TITLE=${SITE_TITLE:-Narrative Builder}
      - OUTPUT_DIR=/app/output_stories
      - DEFAULT_TOTAL_ACTS=${DEFAULT_TOTAL_ACTS:-5}
      - API_BASE_URL=${API_BASE_URL:-http://backend:8000}
      - WS_BASE_URL=${WS_BASE_URL:-ws://backend:8000}
    volumes:
      - ./frontend/output_stories:/app/output_stories
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    restart: always
    ports:
      - "${API_PORT:-9000}:8000"
    environment:
      - API_HOST=0.0.0.0:8000
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - ./output_stories:/app/output_stories
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
