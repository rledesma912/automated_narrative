services:

  # ── Core API (FastAPI/Python) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narrative-api
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file: .env
    environment:
      # DATABASE_URL viene del .env (./data/stories.db) y resuelve a /app/data/stories.db
      # vía volume mount → compartida con el CLI corriendo en el host.
      - OUTPUT_DIR=/app/output_stories
      # Ollama corre en el host — accesible vía host.docker.internal
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data                                        # SQLite DB persistente
      - ./frontend/public/output_stories:/app/output_stories    # Archivos MD exportados (visibles para el frontend Express)
      - ./config:/app/config:ro                                 # Config YAML (sin rebuild al editar)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Node.js/Express) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: narrative-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: frontend/.env
    environment:
      - NODE_ENV=production
      # El container del frontend usa host.docker.internal para alcanzar al backend
      - CORE_API_URL=http://host.docker.internal:8010
    volumes:
      # Mismo directorio que el backend: los MD exportados son visibles de inmediato
      - ./frontend/public/output_stories:/app/public/output_stories
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
