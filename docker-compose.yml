services:

  # ── Core API (FastAPI/Python) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narrative-api
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file: .env.prod
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data/prod:/app/data/prod                              # SQLite DB en prod
      - ./frontend/public/output_stories/prod:/app/output_stories/prod # Relatos en prod
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Node.js/Express) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: narrative-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - CORE_API_URL=http://backend:8010
    volumes:
      - ./frontend/public/output_stories/prod:/app/public/output_stories/prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
